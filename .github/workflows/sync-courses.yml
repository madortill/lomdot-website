name: Import courses from madortill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-courses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import published repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:courses

      - name: Save courses.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/courses.json
          if git diff --cached --quiet; then
            echo "No course changes to save."
          else
            git commit -m "Import courses from madortill"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
